name: Docker build & push

#   pull request            -> build only
#   push to main            -> private ECR (us-east-1) as sha-<commit>, to test unreleased versions
#   push a v* tag on prod   -> Docker Hub as 1.2.3, 1.2, 1
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read
  id-token: write # lets main assume the AWS role via GitHub OIDC

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      TO_ECR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      TO_DOCKERHUB: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the release check below can see prod

      # only tested code reaches Docker Hub: a release tag must point at a commit on prod
      - name: Check release tag is on prod
        if: env.TO_DOCKERHUB == 'true'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/prod; then
            echo "::error::$GITHUB_REF_NAME is not on prod. Merge into prod, then tag the prod commit."
            exit 1
          fi

      - name: Configure AWS credentials
        if: env.TO_ECR == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        if: env.TO_ECR == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        if: env.TO_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.TO_ECR == 'true' && format('{0}/{1}', steps.ecr.outputs.registry, vars.ECR_REPOSITORY) || 'localopsroot/leader-elector' }}
          # sha-<commit> for main (and PR builds, which aren't pushed); versions for releases
          tags: |
            type=sha,enable=${{ env.TO_DOCKERHUB != 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.TO_ECR == 'true' || env.TO_DOCKERHUB == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
