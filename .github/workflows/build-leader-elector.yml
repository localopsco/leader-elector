name: build leader-elector
# Every PR: build the image. Nothing is pushed.
on:
  pull_request:

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: set up docker builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: leader-elector/build

      - name: build leader-elector image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
